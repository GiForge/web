<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MultiTrack Sequencer — Registratore &amp; Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#090d12;--panel:#101820;--panel2:#0c1219;--lane:#070b0f;--track:#141c25;
  --line:#1f2d3a;--line2:#2b3d4e;--txt:#c3d1de;--dim:#75879a;
  --acc:#ff2e5b;--ok:#22d37a;--warn:#ffc531;--vio:#9d6bff;--cyan:#31c9e0;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;min-height:100dvh;touch-action:pan-y pinch-zoom}

@media (max-width: 920px){
  #ctrls{gap:8px;padding:6px;flex-wrap:wrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #app{overflow-x:auto}
  #master{flex:none}
  .hd{padding:4px 6px;height:auto;min-height:56px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .hd .nm{grid-column:1/2;grid-row:1}
  .hd .ch{grid-column:2/3;grid-row:1}
  .hd .btns{grid-column:1/3;grid-row:2;justify-content:flex-start}
  .hd .fx{grid-column:1/3;grid-row:3}
  .stripwrap,.lanewrap{height:auto;min-height:70px}
  .strip,.lane{height:auto;min-height:56px}
  .fx{flex-wrap:wrap;gap:4px}
  #footer{padding:6px;flex-wrap:wrap;gap:6px}
}
@media (max-width: 560px){
  .hd{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .hd .nm{grid-column:1;grid-row:1}
  .hd .ch{grid-column:1;grid-row:2}
  .hd .btns{grid-column:1;grid-row:3;justify-content:flex-start}
  .hd .fx{grid-column:1;grid-row:4}
}

.mono{font-family:'Cascadia Mono',Consolas,'Courier New',monospace}
button{font-family:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--acc);white-space:nowrap}
.grp{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);flex-wrap:wrap}
.grp label{display:flex;align-items:center;gap:5px;white-space:nowrap}
select,input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:3px 6px;border-radius:5px;font-size:10.5px}
input[type=number]{width:50px;text-align:center}
.hb{padding:5px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:5px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.hb:hover{border-color:var(--acc);color:var(--acc)}
.hb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hb.warn.on{background:var(--warn);border-color:var(--warn);color:#000}

/* mixer globale */
.mixer{display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(180deg,#0e161e,#0b1117);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mcol{display:flex;align-items:center;gap:9px}
.mtitle{font-size:9px;letter-spacing:1.6px;color:var(--acc);font-weight:800;border-left:2px solid var(--acc);padding-left:6px}
.fader{display:flex;flex-direction:column;gap:3px;min-width:132px}
.fader .fl{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:.4px}
.fader .fv{font-size:9.5px;color:var(--txt);font-variant-numeric:tabular-nums}
.vu{width:118px;height:7px;background:#05080b;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.vu i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 78%,var(--acc));transition:width .05s linear}
.vu b{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85;left:0}

/* transport */
#transport{display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb2{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#141d27;color:var(--txt);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.12s}
.tb2:disabled{opacity:.26;cursor:not-allowed}
.tb2.p:hover:not(:disabled){background:var(--ok);border-color:var(--ok);color:#04140a}
.tb2.s:hover:not(:disabled){background:#35485b}
.tb2.r{background:var(--acc);border-color:var(--acc);color:#fff}
.tb2.r:hover:not(:disabled){filter:brightness(1.22)}
.tb2.r.rec{animation:pulse 1.05s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,46,91,.55)}50%{box-shadow:0 0 0 12px rgba(255,46,91,0)}}
.tb2.on{color:var(--warn);border-color:var(--warn)}
.tcap{font-size:8.5px;color:var(--dim);text-align:center;width:40px;letter-spacing:.5px}
.tgrp{display:flex;flex-direction:column;align-items:center}
.sep{width:1px;height:32px;background:var(--line)}
#clock{font-size:19px;color:var(--ok);background:#05080b;padding:4px 12px;border-radius:5px;border:1px solid var(--line);letter-spacing:1px}
#pos{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:1px}
#recInfo{font-size:13px;color:var(--acc);min-width:100px;text-align:center}

/* ruler + lanes */
#ruler{position:relative;height:30px;border-bottom:1px solid var(--line2);cursor:pointer}
.mk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:8.5px;color:var(--dim);padding-left:3px;line-height:20px}
.mk.bar{border-left-color:var(--line2);color:#9db0c2;font-weight:700;line-height:30px}
.mkbar2{position:absolute;top:20px;height:10px;border-left:1px solid var(--line);font-size:7.5px;color:#4d5f70;padding-left:2px}
#loopEnd{position:absolute;top:0;bottom:0;width:1px;background:var(--warn);opacity:.55;pointer-events:none}
#ph{position:absolute;top:0;height:100%;width:2px;background:var(--acc);z-index:7;pointer-events:none}
#ph::before{content:'';position:absolute;top:0;left:-3.5px;border:4px solid transparent;border-top-color:var(--acc)}

/* tracks */
/* workspace: colonna mixer fissa + timeline scorrevole */
#workspace{display:flex;align-items:flex-start;background:var(--panel);border-bottom:1px solid var(--line)}
#stripcol{width:750px;flex:none;border-right:1px solid var(--line2);background:var(--panel)}
.colhead{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:9px;letter-spacing:1.5px;color:var(--acc);font-weight:800;border-bottom:1px solid var(--line2);background:var(--panel2)}
.colhead span:last-child{color:var(--dim);font-weight:600}
#strips{display:flex;flex-direction:column;gap:8px;padding:12px 12px 60px}
.stripwrap{height:102px;display:flex;flex-direction:column;gap:0}
.strip{height:76px;flex:none;background:var(--track);border:1px solid var(--line);border-radius:8px 8px 0 0;overflow:hidden}
.strip.armed{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.strip.rec{border-color:var(--acc);animation:glow 1.05s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,46,91,.3)}50%{box-shadow:0 0 14px 0 rgba(255,46,91,.12)}}
.stripinfo{height:26px;flex:none;background:var(--panel2);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;display:flex;align-items:center;gap:8px;padding:0 9px;font-size:8.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
.stripinfo b{color:var(--txt);font-weight:600}
#timecol{flex:1;overflow-x:auto;overflow-y:hidden;min-width:0}
#ruler{height:30px;position:relative;border-bottom:1px solid var(--line2);cursor:pointer}
#lanes{display:flex;flex-direction:column;gap:8px;padding:12px 0 8px}
.lanewrap{height:102px;display:flex;flex-direction:column}
.lane{height:76px;flex:none;background:var(--lane);border:1px solid var(--line);border-radius:8px 8px 0 0;position:relative;cursor:crosshair;overflow:hidden}
.lane.armed{border-color:var(--acc)}
.edtbar{height:26px;flex:none;background:var(--panel2);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;display:flex;align-items:center;gap:3px;padding:0 4px;overflow:hidden}
.hd{display:grid;grid-template-columns:112px minmax(88px,1fr) 186px;grid-template-rows:auto auto;gap:6px 9px;padding:6px 10px;align-items:center;height:76px}
.hd .nm{grid-column:1;grid-row:1}
.hd .ch{grid-column:2;grid-row:1}
.hd .btns{grid-column:3;grid-row:1}
.hd .fx{grid-column:1 / -1;grid-row:2}
.nm{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.nm b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.nm input{background:#05080b;border:1px solid var(--acc);color:var(--txt);padding:2px 5px;border-radius:4px;font-size:12.5px;width:100%}
.ch{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:6px}
.row>span{font-size:8.5px;color:var(--dim);width:24px;flex:none;letter-spacing:.4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--line2);border-radius:2px;flex:1;cursor:pointer;min-width:32px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid var(--track)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid var(--track)}
.vd{font-size:8.5px;color:var(--dim);width:32px;text-align:right;flex:none;font-style:normal;font-variant-numeric:tabular-nums}
.mvu{width:52px;height:6px;background:#05080b;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;flex:none}
.mvu i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 78%,var(--acc))}
.fx{display:flex;gap:5px;align-items:center}
.fxb{background:#05080b;border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:flex;flex-direction:row;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.fxb.act{border-color:var(--vio);background:rgba(157,107,255,.07)}
.fxh{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.fxb.act .fxh{color:var(--vio)}
.fxb input[type=checkbox]{accent-color:var(--vio);cursor:pointer;margin:0;width:12px;height:12px}
.fxp{display:flex;gap:3px;align-items:center;min-width:0;flex:1}
.fxp em{font-size:7.5px;color:#4b5a68;font-style:normal}
.fxp input[type=range]{width:30px;min-width:30px;height:14px;background:transparent;flex:none;border-radius:0}
.fxp input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line2);border-radius:2px}
.fxp input[type=range]::-webkit-slider-thumb{margin-top:-5px}
.fxp input[type=range]::-moz-range-track{height:4px;background:var(--line2);border-radius:2px}
.fxp input[type=range]:disabled{opacity:.35}
.btns{display:flex;gap:3px;flex-wrap:nowrap;justify-content:flex-end;align-items:center}
.edtbar .k{padding:3px 7px}
.k{padding:4px 6px;background:#05080b;border:1px solid var(--line);border-radius:4px;color:var(--dim);cursor:pointer;font-size:8.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.k:hover{border-color:var(--line2);color:var(--txt)}
.k.on{background:var(--acc);border-color:var(--acc);color:#fff}
.k.w.on{background:var(--warn);border-color:var(--warn);color:#000}
.k.r.on{background:#e74c3c;border-color:#e74c3c;color:#fff}
.k.d:hover{border-color:#e74c3c;color:#e74c3c}
.k:disabled{opacity:.3;cursor:not-allowed}

/* regioni */
.rgn{position:absolute;top:3px;bottom:3px;border-radius:4px;overflow:hidden;border:1px solid;background:#05080b;cursor:grab}
.rgn.sel{border-width:2px;box-shadow:0 0 0 1px #fff inset,0 0 9px rgba(255,255,255,.28);z-index:3}
.rgn canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.92;pointer-events:none}
.rgn .tag{position:absolute;left:3px;top:1px;font-size:7.5px;color:#dbe6f0;text-shadow:0 1px 2px #000;pointer-events:none;letter-spacing:.3px}
.rgn.mov{cursor:grabbing}
.rgn .hd2{position:absolute;top:0;bottom:0;width:8px;z-index:3;cursor:ew-resize;background:rgba(255,255,255,.12)}
.rgn .hd2::before{content:'';position:absolute;top:0;bottom:0;left:-4px;width:16px}
.rgn .hd2:hover{background:rgba(255,255,255,.35)}
.rgn .hd2.l{left:0}.rgn .hd2.r{right:0}
.selband{position:absolute;top:0;bottom:0;background:rgba(157,107,255,.26);border-left:1px solid var(--vio);border-right:1px solid var(--vio);pointer-events:none;z-index:4}
.recblk{position:absolute;top:3px;bottom:3px;background:rgba(255,46,91,.3);border:1px dashed var(--acc);border-radius:4px;pointer-events:none;z-index:5;display:none}
.ph{position:absolute;top:0;bottom:0;width:1px;background:var(--acc);pointer-events:none;z-index:6;display:none}
.ph::before{content:'';position:absolute;top:0;left:-3.5px;border:4px solid transparent;border-top-color:var(--acc)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#3f4d5a;font-style:italic;pointer-events:none}
.add{align-self:center;padding:9px 26px;background:transparent;border:2px dashed var(--line);border-radius:8px;color:var(--dim);cursor:pointer;font-size:11.5px;font-weight:700;margin:4px 0 14px}
.add:hover{border-color:var(--acc);color:var(--acc)}
#status{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:5px 16px;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;z-index:80}
#smsg.rec{color:var(--acc);font-weight:700}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:300}
#ov.show{display:flex}
.mo{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px;max-width:440px;width:92%}
.mo h3{color:var(--acc);margin-bottom:8px;font-size:14px}
.mo p{color:var(--dim);line-height:1.6;margin-bottom:15px;font-size:11.5px;white-space:pre-wrap}
.mo button{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:11.5px;margin-right:7px}
.mo .ok{background:var(--acc);color:#fff}
.mo .no{background:var(--line);color:var(--txt)}
@media(max-width:1150px){.hd{grid-template-columns:1fr 1fr;gap:8px}.btns{justify-content:flex-start}}
</style>
</head>
<body>

<header>
  <div class="brand">◉ MULTITRACK SEQUENCER</div>
  <div class="grp">
    <label>BPM <input type="number" id="bpm" value="120" min="40" max="300"></label>
    <label>Loop <select id="loopBars"><option value="4">4</option><option value="8">8</option><option value="16" selected>16</option><option value="32">32</option></select> bar</label>
    <label>Reg. <select id="recMode"><option value="add" selected>Aggiungi</option><option value="mix">Sovrapponi</option><option value="punch">Punch</option></select></label>
    <label>Conto <select id="countIn"><option value="0" selected>0</option><option value="1">1 bar</option><option value="2">2 bar</option></select></label>
    <label>Zoom <select id="zoom"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <button class="hb warn on" id="bLoop">↻ Loop</button>
    <button class="hb" id="bMet">♪ Metro</button>
    <button class="hb" id="bMon">🎧 Monitor</button>
    <button class="hb" id="bExp">⬇ WAV</button>
  </div>
</header>

<div class="mixer">
  <div class="mtitle">MIXER<br>GLOBALE</div>
  <div class="mcol fader">
    <div class="fl"><span>VOLUME</span><span class="fv" id="mVolV">85%</span></div>
    <input type="range" id="mVol" min="0" max="1.2" step="0.01" value="0.85">
  </div>
  <div class="mcol fader">
    <div class="fl"><span>DX / SX</span><span class="fv" id="mPanV">CENTRO</span></div>
    <input type="range" id="mPan" min="-1" max="1" step="0.01" value="0">
  </div>
  <div class="mcol fader">
    <div class="fl"><span>LIMITER</span><span class="fv" id="mGainV">+0 dB</span></div>
    <input type="range" id="mGain" min="-24" max="12" step="0.5" value="0">
  </div>
  <div class="mcol">
    <div class="fl" style="font-size:9px;color:var(--dim);letter-spacing:.4px">MASTER OUT</div>
    <div class="vu"><i id="mVu"></i><b id="mPk"></b></div>
  </div>
</div>

<div id="transport">
  <div class="tgrp"><button class="tb2 p" id="bPlay" title="Play — Spazio">▶</button><div class="tcap">PLAY</div></div>
  <div class="tgrp"><button class="tb2 s" id="bStop" title="Stop">■</button><div class="tcap">STOP</div></div>
  <div class="tgrp"><button class="tb2 r" id="bRec" title="Registra — R">●</button><div class="tcap">REC</div></div>
  <div class="sep"></div>
  <div class="tgrp"><button class="tb2" id="bHome" title="Torna all'inizio">⏮</button><div class="tcap">HOME</div></div>
  <div class="sep"></div>
  <div><div id="clock" class="mono">00:00.000</div><div id="pos" class="mono">1.1.00</div></div>
  <div class="sep"></div>
  <div><div id="recInfo" class="mono">—</div></div>
</div>

<div id="workspace">
  <div id="stripcol">
    <div class="colhead"><span>TRACCE</span><span>MIXER · VOL / PAN · FX · EDIT</span></div>
    <div id="strips"></div>
  </div>
  <div id="timecol">
    <div id="ruler"></div>
    <div id="lanes"></div>
    <button class="add" id="bAdd">+ Nuova traccia</button>
  </div>
</div>

<div id="status"><span id="smsg">Pronto.</span><span id="sr"></span></div>

<div id="ov"><div class="mo"><h3 id="ovT"></h3><p id="ovM"></p><button class="ok" id="ovOk">OK</button><button class="no" id="ovNo">Chiudi</button></div></div>

<script>
"use strict";
/* =====================================================================
   MULTITRACK SEQUENCER — registrazione, editing a regioni, mixer
   Web Audio API. Nessuna dipendenza esterna.
   ===================================================================== */
const A = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:'interactive' });
const BASE_PX = 64;                 // px per secondo a zoom 1
const EPS = 1e-6;

/* ------------------------- stato ------------------------- */
let master, masterPan, limiter, mAnalyser;
let tracks = [], tid = 0, rid = 0;
let armed = null;
let state = 'stopped';               // stopped | countin | playing | recording
let playT0 = 0, playOff = 0;
let zoom = 1;
let raf = null, loopTimer = null, countTimer = null, metTimer = null, metNext = 0, pkTimer = null;
let loopOn = true, metronome = false, monitor = false;
let stream = null, inSrc = null, monGain = null, recNode = null;
let capture = false, chunks = [], recT0 = 0, recStartPos = 0, countT0 = 0, countLen = 0;
let recTarget = null, recKind = '', clip = [];
let drag = null;
let pkHold = 0;

const $ = s => document.querySelector(s);
const stripsEl = $('#strips'), lanesEl = $('#lanes'), ruler = $('#ruler'), smsg = $('#smsg'), srEl = $('#sr');
const bPlay = $('#bPlay'), bStop = $('#bStop'), bRec = $('#bRec'), clock = $('#clock'), posEl = $('#pos'), recInfo = $('#recInfo');
const mVu = $('#mVu'), mPk = $('#mPk');

const px = () => BASE_PX * zoom;
const bpm = () => Math.max(40, Math.min(300, parseInt($('#bpm').value) || 120));
const spb = () => 60 / bpm();
const barSec = () => spb() * 4;
const loopBars = () => parseInt($('#loopBars').value);
const totalSec = () => loopBars() * barSec();
const running = () => state !== 'stopped';

function fmt(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), c = Math.floor(s % 60), x = Math.floor((s % 1) * 1000);
  return String(m).padStart(2, '0') + ':' + String(c).padStart(2, '0') + '.' + String(x).padStart(3, '0');
}

/* =========================== BUS MASTER =========================== */
master = A.createGain(); master.gain.value = 0.85;
masterPan = A.createStereoPanner();
limiter = A.createDynamicsCompressor();
limiter.threshold.value = -1.5; limiter.knee.value = 0; limiter.ratio.value = 20;
limiter.attack.value = 0.002; limiter.release.value = 0.08;
mAnalyser = A.createAnalyser(); mAnalyser.fftSize = 1024;
master.connect(masterPan); masterPan.connect(limiter); limiter.connect(mAnalyser);
mAnalyser.connect(A.destination);

/* =========================== RIVERBERO =========================== */
function makeIR(dur, decay) {
  const n = Math.max(64, Math.floor(A.sampleRate * dur));
  const b = A.createBuffer(2, n, A.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  }
  return b;
}

/* ============ grafo per traccia: creato una volta, resta vivo ============ */

/* =====================================================================
   MODELLO A REGIONI — ogni regione = { id, buffer, start, peak }
   ===================================================================== */
function peakOf(b) {
  const d = b.getChannelData(0);
  const st = Math.max(1, Math.floor(d.length / 6000));
  let p = 0;
  for (let i = 0; i < d.length; i += st) { const a = Math.abs(d[i]); if (a > p) p = a; }
  return p || 0;
}
function mkRegion(buffer, start) { return { id: ++rid, buffer, start: Math.max(0, start), peak: peakOf(buffer) }; }

function sliceBuf(b, off, len) {
  off = Math.max(0, Math.floor(off));
  len = Math.max(0, Math.min(Math.floor(len), b.length - off));
  const out = A.createBuffer(b.numberOfChannels, Math.max(1, len), b.sampleRate);
  for (let c = 0; c < b.numberOfChannels; c++)
    out.getChannelData(c).set(b.getChannelData(c).subarray(off, off + len));

}
function addInto(dst, dstOff, src, srcOff, len) {
  srcOff = Math.max(0, Math.floor(srcOff)); dstOff = Math.max(0, Math.floor(dstOff));
  for (let c = 0; c < dst.numberOfChannels; c++) {
    const d = dst.getChannelData(c);
    const s = src.numberOfChannels > c ? src.getChannelData(c) : src.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const di = dstOff + i, si = srcOff + i;
      if (di >= dst.length || si >= src.length) break;

}

  for (let i = 0; i < len; i += 2) { const a = Math.abs(d[off + i]); if (a > p) p = a; }

function sortRegions(tr) { tr.regions.sort((a, b) => a.start - b.start || a.id - b.id); }
function trkLen(tr) { let m = 0; tr.regions.forEach(r => { if (rEnd(r) > m) m = rEnd(r); }); return m; }

/* split esatto al tempo t (t dentro una regione -> due regioni) */
function splitAt(tr, t) {
  const out = [];
  for (const r of tr.regions) {
    const s = r.start, e = rEnd(r);
    if (t > s + 0.001 && t < e - 0.001) {
      const sr = r.buffer.sampleRate, total = r.buffer.length;
      const n = Math.max(1, Math.min(total - 1, Math.round((t - s) * sr)));
      out.push(mkRegion(sliceBuf(r.buffer, 0, n), s));

  tr.regions = tr.regions.filter(r => rEnd(r) <= from + EPS || r.start >= to - EPS);
  const removed = before - tr.regions.length;

  tr.regions.forEach(r => {

/* inserisce audio a partire da time — modalità add / mix */

    tr.regions.push(mkRegion(buf, time)); sortRegions(tr); return;
  }
  const end = time + buf.duration;
  splitAt(tr, time); splitAt(tr, end);
  const pts = new Set([time, end]);
  tr.regions.forEach(r => {
    const s = r.start, e = rEnd(r);
    if (s > time + EPS && s < end - EPS) pts.add(s);
    if (e > time + EPS && e < end - EPS) pts.add(e);

/* =========================== REGISTRAZIONE =========================== */
const WORKLET_SRC = `
class P extends AudioWorkletProcessor{
  constructor(){super();this.on=false;this.port.onmessage=e=>{if(e.data==='start')this.on=true;else if(e.data==='stop')this.on=false;};}
  process(inputs){const ch=inputs[0];
    if(this.on&&ch&&ch.length&&ch[0]&&ch[0].length){
      const cs=[];for(let c=0;c<ch.length;c++)cs.push(new Float32Array(ch[c]));
      this.port.postMessage({c:cs,n:ch[0].length},cs.map(x=>x.buffer));
    }
    return true;}
}
registerProcessor('pcmcap',P);`;

function pushChunk(d) { if (capture) chunks.push({ c: d.c, n: d.n }); }

async function buildRecNode(src) {
  if (A.audioWorklet) {
    try {
      const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
      await A.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      const n = new AudioWorkletNode(A, 'pcmcap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
      n.port.onmessage = e => pushChunk(e.data);
      const s = A.createGain(); s.gain.value = 0;
      src.connect(n); n.connect(s); s.connect(A.destination);
      return {
        kind: 'AudioWorklet',
        start() { capture = true; n.port.postMessage('start'); },
        stop() { capture = false; n.port.postMessage('stop'); },
        dispose() { try { n.disconnect(); } catch (e) {} try { s.disconnect(); } catch (e) {} }
      };
    } catch (e) { console.warn('AudioWorklet indisponibile → ScriptProcessor', e); }
  }
  const n = A.createScriptProcessor(4096, 1, 1);
  n.onaudioprocess = e => {
    if (!capture) return;
    const ib = e.inputBuffer, cs = [];
    for (let c = 0; c < ib.numberOfChannels; c++) cs.push(new Float32Array(ib.getChannelData(c)));
    pushChunk({ c: cs, n: ib.length });
  };
  const s = A.createGain(); s.gain.value = 0;
  src.connect(n); n.connect(s); s.connect(A.destination);
  return {
    kind: 'ScriptProcessor', start() { capture = true; }, stop() { capture = false; },
    dispose() { try { n.disconnect(); } catch (e) {} try { s.disconnect(); } catch (e) {} }
  };
}
function assemble() {
  if (!chunks.length) return null;
  const tot = chunks.reduce((a, x) => a + x.n, 0), ch = chunks[0].c.length;
  const b = A.createBuffer(ch, tot, A.sampleRate);
  for (let c = 0; c < ch; c++) {
    const d = b.getChannelData(c); let o = 0;
    for (const x of chunks) { d.set(x.c[Math.min(c, x.c.length - 1)], o); o += x.n; }
  }
  return b;
}

async function recStart() {
  if (state === 'recording') { endCapture(); return; }
  if (!armed) { modal('Nessuna traccia armata', 'Clicca ARM sulla traccia dove vuoi registrare, poi premi REC.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    modal('Microfono non disponibile', 'navigator.mediaDevices non è disponibile in questo contesto.\n\nApri con un browser aggiornato (Chrome/Edge/Firefox) oppure via http://localhost.'); return;
  }
  try {
    if (A.state === 'suspended') await A.resume();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) { modal('Accesso al microfono negato', gumMsg(e)); return; }

  recTarget = tracks.find(t => t.id === armed);
  if (!recTarget) { releaseMic(); return; }
  try {
    inSrc = A.createMediaStreamSource(stream);
    monGain = A.createGain(); monGain.gain.value = monitor ? 0.9 : 0;
    inSrc.connect(monGain); monGain.connect(master);
    recNode = await buildRecNode(inSrc);
    recKind = recNode.kind;
  } catch (e) { releaseMic(); modal('Errore audio', String(e)); return; }

  chunks = []; capture = false;
  recStartPos = Math.max(0, pos());
  const ci = parseInt($('#countIn').value) || 0;
  if (A.state === 'suspended') await A.resume();
  playOff = recStartPos; playT0 = A.currentTime;

  if (ci > 0 && recStartPos < 0.01) {
    state = 'countin'; countLen = ci * barSec(); countT0 = A.currentTime; playOff = 0; playT0 = A.currentTime;
    metKick(); upd();
    countTimer = setTimeout(() => { countTimer = null; beginCapture(); }, countLen * 1000);
  } else beginCapture();
}

  playOff = recStartPos; playT0 = A.currentTime;
  state = 'recording';
  startSources(); armLoop();
  recT0 = A.currentTime; capture = true; recNode.start();
  if (recTarget) {
    recTarget.strip.classList.add('rec');
    const blk = recTarget.laneEl.querySelector('.recblk');
    blk.style.display = 'block';
    blk.style.left = (recStartPos * px()) + 'px';
    blk.style.width = '2px';

  releaseMic();
  if (recTarget) {
    recTarget.laneEl.querySelector('.recblk').style.display = 'none';
    recTarget.strip.classList.remove('rec');
  }
  smsg.className = '';
  const buf = assemble();
  if (recTarget) {
    if (!buf || buf.length < 64) {
      smsg.textContent = 'Nessun audio catturato — riprova.';
    } else {
      const mode = $('#recMode').value;
      if (mode === 'mix') insertAudio(recTarget, recStartPos, buf, 'mix');
      else if (mode === 'punch') punchAudio(recTarget, recStartPos, buf);
      else insertAudio(recTarget, recStartPos, buf, 'add');
      drawLane(recTarget); drawRuler(); upd();
      playOff = recStartPos; playT0 = A.currentTime;
      refreshAudio();
      smsg.textContent = 'Registrato su "' + recTarget.name + '" — ' + fmt(buf.duration) + '  [' + recKind + ' · ' + mode + ']';

function gumMsg(e) {
  if (e.name === 'NotAllowedError' || e.name === 'SecurityError')

  if (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')
    return 'Nessun microfono trovato. Collega un dispositivo di input.';
  if (e.name === 'NotReadableError') return 'Il microfono è occupato da un’altra applicazione. Chiudila e riprova.';

/* =========================== TRASPORTO =========================== */
function pos() {

  if (!running()) return playOff;
  return playOff + (A.currentTime - playT0);
}
function startSources() {
  const from = Math.max(0, pos());
  tracks.forEach(tr => {
    tr.regions.forEach(r => {
      const e = rEnd(r);
      if (e <= from) return;
      const s = A.createBufferSource(); s.buffer = r.buffer;
      const skip = Math.max(0, from - r.start);
      if (r.start >= from) s.connect(tr.io.g), s.start(0);
      else { s.connect(tr.io.g); s.start(A.currentTime + (r.start - from), skip); }
      tr.src.push(s);

function stopSources() {
  tracks.forEach(tr => {
    tr.src.forEach(s => { try { s.stop(); } catch (e) {} try { s.disconnect(); } catch (e) {} });
    tr.src.length = 0;
  });
}
function play() {
  if (running()) return;
  if (A.state === 'suspended') A.resume();
  state = 'playing'; playT0 = A.currentTime;
  startSources(); armLoop(); metKick(); upd();
}
function stopAll(reset) {
  if (state === 'recording') endCapture();
  if (countTimer) { clearTimeout(countTimer); countTimer = null; }
  stopSources();
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
  state = 'stopped';
  if (reset) { playOff = 0; ph.style.left = '0px'; clock.textContent = '00:00.000'; posEl.textContent = '1.1.00'; }
  recInfo.textContent = '—'; srEl.textContent = '';

  if (was) stopSources();
  playOff = Math.max(0, t);
  playT0 = A.currentTime;
  if (was) startSources();

}
function armLoop() {
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
  if (!running() || state === 'countin') return;
  const ts = totalSec(), el = (A.currentTime - playT0) + playOff;
  const rem = Math.max(0.02, ts - (el % ts));
  loopTimer = setTimeout(() => {
    loopTimer = null;
    if (!running()) return;
    if (loopOn) { playOff = 0; playT0 = A.currentTime; startSources(); armLoop(); }
    else stopAll(false);

/* metronomo con lookahead */
function click(t, f) {
  const o = A.createOscillator(), g = A.createGain();
  o.type = 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.0008, t + .045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .05);

function metFn() {
  if (!metronome) { metNext = 0; return; }
  if (running() && metNext < A.currentTime + .12) {
    if (metNext < A.currentTime) metNext = A.currentTime + .02;
    while (metNext < A.currentTime + .12) {
      const rel = (metNext - playT0) + playOff;
      const inBar = ((rel % barSec()) + barSec()) % barSec();
      const strong = inBar < spb() * .03;
      click(metNext, strong ? 1500 : 950);
      metNext += spb();
    }
  }
  metTimer = setTimeout(metFn, 40);
}
function metKick() { if (!metronome) return; if (metTimer) clearTimeout(metTimer); metNext = A.currentTime + .05; metFn(); }

  const cs = Math.floor(((shown % barSec()) % spb()) / spb() * 100);
  posEl.textContent = b + '.' + bt + '.' + String(cs).padStart(2, '0');

function selMark(lane, r) {
  if (!lane) return;
  lane.querySelectorAll('.rgn').forEach(x => x.classList.toggle('sel', !!r && +x.dataset.rid === r.id));
  const band = lane.querySelector('.selband');
  if (!band) return;

    band.style.width = Math.max(1, r.buffer.duration * px()) + 'px';
  } else band.style.display = 'none';
}
function drawLane(tr) {

    d.appendChild(cv);

    d.appendChild(tag);
    const hl = document.createElement('div'); hl.className = 'hd2 l'; hl.dataset.h = 'l'; d.appendChild(hl);
    const hr = document.createElement('div'); hr.className = 'hd2 r'; hr.dataset.h = 'r'; d.appendChild(hr);
    lane.appendChild(d);
    paintRegion(cv, r, d.clientWidth || Math.max(3, r.buffer.duration * P), tr.color);

    const s = document.createElement('div');
    s.className = 'selband';

    lane.appendChild(s);

  if (emp) emp.style.display = tr.regions.length ? 'none' : 'flex';

  }

      ? ('selezione ' + fmt(tr.sel.from) + ' → ' + fmt(tr.sel.to) + '  (' + (tr.sel.to - tr.sel.from).toFixed(2) + 's)')

function paintRegion(cv, r, w, color) {
  const dpr = window.devicePixelRatio || 1;
  const h = cv.parentElement ? cv.parentElement.clientHeight : 60;
  w = Math.max(2, Math.floor(w));
  const cw = Math.min(w, 2600);
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cw, h);
  const data = r.buffer.getChannelData(0), n = data.length;
  const step = Math.max(1, Math.floor(n / cw)), mid = h / 2;
  const norm = r.peak > 0.001 ? 0.92 / r.peak : 1;
  g.fillStyle = color + '1c'; g.fillRect(0, 0, cw, h);
  g.strokeStyle = color; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x < cw; x++) {
    let mn = Infinity, mx = -Infinity, any = false;
    const base = Math.floor(x * n / cw);
    for (let j = 0; j < step; j++) {
      const i = base + j; if (i >= n) break;
      const v = data[i]; any = true; if (v < mn) mn = v; if (v > mx) mx = v;
    }
    if (!any) { mn = 0; mx = 0; }
    g.moveTo(x + .5, mid - mx * norm * mid * .94);
    g.lineTo(x + .5, mid - mn * norm * mid * .94);
  }
  g.stroke();
}

/* =========================== EXPORT WAV =========================== */
async function exportWav() {
  const use = tracks.filter(t => t.regions.length);
  if (!use.length) { modal('Nessun audio da esportare', 'Registra almeno una regione, poi esporta il mixdown.'); return; }
  let end = 0; use.forEach(t => { const l = trkLen(t); if (l > end) end = l; });
  const len = Math.ceil((end + 2) * A.sampleRate);
  const O = new OfflineAudioContext(2, len, A.sampleRate);
  const mg = O.createGain(); mg.gain.value = master.gain.value * Math.pow(10, parseFloat($('#mGain').value) / 20);
  const mp = O.createStereoPanner(); mp.pan.value = masterPan.pan.value;
  const lim = O.createDynamicsCompressor();
  lim.threshold.value = -1.5; lim.knee.value = 0; lim.ratio.value = 20;
  mg.connect(mp); mp.connect(lim); lim.connect(O.destination);
  const solo = tracks.some(t => t.solo);
  let nreg = 0;
  use.forEach(tr => {
    const io = createIO(O, tr, mg, false);
    io.p.pan.value = tr.pan;
    io.rs.gain.value = tr.revOn ? tr.revMix : 0;
    io.es.gain.value = tr.echoOn ? tr.echoMix : 0;
    io.del.delayTime.value = tr.echoTime;
    io.fb.gain.value = tr.echoOn ? tr.echoFb : 0;
    io.g.gain.value = (tr.mute || (solo && !tr.solo)) ? 0 : tr.vol;
    tr.regions.forEach(r => {
      const s = O.createBufferSource(); s.buffer = r.buffer; s.connect(io.g);
      s.start(Math.max(0, r.start)); nreg++;
    });
  });
  const out = await O.startRendering();
  const blob = encodeWav(out), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'mixdown-' + use.length + 'tr-' + nreg + 'reg-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.wav';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  smsg.textContent = 'Mixdown esportato: ' + use.length + ' tracce, ' + nreg + ' regioni, ' + fmt(out.duration);
}
function encodeWav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const cs = []; for (let c = 0; c < ch; c++) cs.push(buf.getChannelData(c));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const s = Math.max(-1, Math.min(1, cs[c][i]));
    v.setInt16(o, s < 0 ? s * 32768 : s * 32767, true); o += 2;
  }
  return new Blob([ab], { type: 'audio/wav' });
}

$('#bHome').addEventListener('click', () => { seek(0); });
$('#bAdd').addEventListener('click', () => addTrack());
$('#bLoop').addEventListener('click', e => {
  loopOn = !loopOn; e.target.classList.toggle('on', loopOn);
  smsg.textContent = loopOn ? 'Loop attivo.' : 'Loop disattivato.'; armLoop();
});
$('#bMet').addEventListener('click', e => {
  metronome = !metronome; e.target.classList.toggle('on', metronome);
  if (metronome) metKick();
  else if (metTimer) { clearTimeout(metTimer); metTimer = null; metNext = 0; }
});
$('#bMon').addEventListener('click', e => {
  monitor = !monitor; e.target.classList.toggle('on', monitor);
  if (monGain) monGain.gain.value = monitor ? 0.9 : 0;
  smsg.textContent = monitor ? 'Monitor ON — usa le cuffie per evitare il feedback.' : 'Monitor OFF.';
});
$('#bExp').addEventListener('click', exportWav);
$('#bpm').addEventListener('change', drawRuler);
$('#loopBars').addEventListener('change', () => { drawRuler(); armLoop(); });
$('#zoom').addEventListener('change', e => {
  zoom = parseFloat(e.target.value);
  drawRuler(); tracks.forEach(drawLane);
});
$('#mVol').addEventListener('input', e => {
  const v = parseFloat(e.target.value); master.gain.value = v;
  $('#mVolV').textContent = Math.round(v * 100) + '%';
});
$('#mPan').addEventListener('input', e => {
  const v = parseFloat(e.target.value); masterPan.pan.value = v;
  $('#mPanV').textContent = v === 0 ? 'CENTRO' : (v < 0 ? 'SX ' : 'DX ') + Math.abs(Math.round(v * 100));
});
$('#mGain').addEventListener('input', e => {
  const db = parseFloat(e.target.value);
  master.gain.value = parseFloat($('#mVol').value) * Math.pow(10, db / 20);
  $('#mGainV').textContent = (db > 0 ? '+' : '') + db.toFixed(1) + ' dB';
});
$('#timecol').addEventListener('scroll', () => {});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  const wasTrim = drag.trim, wasMove = drag.move;
  drag = null;
  const dtr = wasTrim ? wasTrim.tr : wasMove ? wasMove.tr : null;
  if (dtr) { sortRegions(dtr); drawLane(dtr); refreshAudio(); }
});
window.addEventListener('blur', () => { drag = null; });
document.addEventListener('mouseleave', () => { drag = null; });
window.addEventListener('resize', () => { drawRuler(); tracks.forEach(drawLane); });

  function pos(e){
    if (e.touches && e.touches[0]) return e.touches[0];
    if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0];
    return e;
  }
  lane.addEventListener('touchstart', e => {
    const p = pos(e);
    const me = new MouseEvent('mousedown', {bubbles:true, clientX:p.clientX, clientY:p.clientY, cancelable:true});
    e.target.dispatchEvent(me); e.preventDefault();
  }, {passive:false});
  lane.addEventListener('touchmove', e => {
    const p = pos(e);
    const me = new MouseEvent('mousemove', {bubbles:true, clientX:p.clientX, clientY:p.clientY, cancelable:true});
    document.dispatchEvent(me); e.preventDefault();
  }, {passive:false});
  lane.addEventListener('touchend', e => {
    const p = pos(e.changedTouches[0] || e.touches[0] || {clientX:0,clientY:0});
    const me = new MouseEvent('mouseup', {bubbles:true, clientX:p.clientX, clientY:p.clientY, cancelable:true});
    document.dispatchEvent(me); e.preventDefault();
  }, {passive:false});
document.addEventListener('keydown', e => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); if (state === 'recording') endCapture(); else recStart(); }
  else if (e.key === 'm' || e.key === 'M') $('#bMet').click();
  else if (e.key === 's' || e.key === 'S') {
    const t = tracks.find(x => x.id === armed);
    if (!t) { smsg.textContent = 'Arma una traccia prima di tagliare (S).'; return; }
    const p = pos();
    if (!t.regions.some(r => p > r.start + .002 && p < rEnd(r) - .002)) { smsg.textContent = 'Nessuna regione sotto il playhead.'; return; }
    splitAt(t, p); drawLane(t); drawRuler(); refreshAudio();
    smsg.textContent = 'Tagliato a ' + fmt(p) + '.';
  }
});

/* =========================== AVVIO =========================== */
addTrack();
drawRuler();
upd();
meters();
(function loop2() {
  const raw = pos();
  if (running() || state === 'countin') draw();
  if (state === 'recording') {
    const s = A.currentTime - recT0;
    recInfo.textContent = 'REC ' + s.toFixed(1) + 's';
  } else if (state === 'countin') {
    recInfo.textContent = 'CONTO ' + Math.max(0, countLen - (A.currentTime - countT0)).toFixed(1) + 's';
  } else if (raw >= 0) recInfo.textContent = 'POS ' + fmt(raw);
  requestAnimationFrame(loop2);
})();
smsg.textContent = 'Pronto. ARM una traccia e premi REC (R). Spazio = play/stop. Trascina una regione per spostarla, i bordi per tagliarla, lo sfondo per selezionare un intervallo.';
</script>
